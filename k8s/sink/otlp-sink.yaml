---
apiVersion: v1
kind: Namespace
metadata:
  name: bench-sink
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otlp-sink-config
  namespace: bench-sink
data:
  # Traces are discarded, but counted twice: the receiver counter on :8888 is
  # the total the gateway delivered (plus refused/failed, the backpressure
  # evidence), and the spanmetrics connector on :8889 counts spans per
  # service.name and span.kind, which is what gives each cell its own
  # spans-per-request and keep-rate while all cells export to one sink.
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            max_recv_msg_size_mib: 64
          http:
            endpoint: 0.0.0.0:4318
    connectors:
      spanmetrics:
        histogram:
          disable: true
        exclude_dimensions: [status.code]
        metrics_flush_interval: 15s
    exporters:
      nop: {}
      prometheus:
        endpoint: 0.0.0.0:8889
        send_timestamps: false
    service:
      telemetry:
        metrics:
          level: normal
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [nop, spanmetrics]
        metrics/spanmetrics:
          receivers: [spanmetrics]
          exporters: [prometheus]
        metrics:
          receivers: [otlp]
          exporters: [nop]
        logs:
          receivers: [otlp]
          exporters: [nop]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otlp-sink
  namespace: bench-sink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otlp-sink
  template:
    metadata:
      labels:
        app: otlp-sink
    spec:
      nodeSelector:
        bench-lane: shared
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.121.0
          args: ["--config=/etc/otel/config.yaml"]
          ports:
            - containerPort: 4317
            - containerPort: 4318
            - containerPort: 8888
            - containerPort: 8889
          volumeMounts:
            - name: config
              mountPath: /etc/otel
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 4Gi
      volumes:
        - name: config
          configMap:
            name: otlp-sink-config
---
apiVersion: v1
kind: Service
metadata:
  name: otlp-sink
  namespace: bench-sink
spec:
  selector:
    app: otlp-sink
  ports:
    - name: grpc
      port: 4317
      targetPort: 4317
    - name: http
      port: 4318
      targetPort: 4318
    - name: metrics
      port: 8888
      targetPort: 8888
    - name: spanmetrics
      port: 8889
      targetPort: 8889
