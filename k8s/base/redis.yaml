apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: redis
    bench-role: deps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        bench-role: deps
    spec:
      nodeSelector:
        bench-deps: placeholder
      tolerations:
        - key: bench-deps
          operator: Equal
          value: placeholder
          effect: NoSchedule
      containers:
        - name: redis
          image: redis:7
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
